<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0C0A07">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="手指特訓">
<meta name="application-name" content="FingerDrill">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="description" content="FingerDrill 手指特訓:鋼琴音階、琶音、哈農練習與 ABRSM / Trinity 檢定抽考,附五線譜指法、取樣鋼琴示範與節拍器。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='4' fill='%230C0A07'/%3E%3Cg fill='none' stroke='%23F2B94B' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' transform='translate(0.6 0) scale(0.95)'%3E%3Cpath d='M18 11V6a2 2 0 0 0-4 0v5'/%3E%3Cpath d='M14 10V4a2 2 0 0 0-4 0v6'/%3E%3Cpath d='M10 10.5V6a2 2 0 0 0-4 0v8'/%3E%3Cpath d='M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15'/%3E%3C/g%3E%3C/svg%3E">
<title>FingerDrill 手指特訓</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css?v=a1c4d40e85">
</head>
<body>
<header>
  <div class="header-left">
    <h1>Finger<span>Drill</span></h1>
    <span class="tagline">手指特訓</span>
  </div>
  <div class="header-right">
    <button class="btn small ghost" id="examChip" hidden></button>
    <button class="btn" id="themeToggle" aria-pressed="false" data-i18n-attr="aria-label:themeToggleLabel,title:themeToggleTitle" aria-label="淺色模式" title="切換淺色/深色主題">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 000 18z" fill="currentColor" stroke="none"/></svg>
    </button>
    <button class="btn" id="langToggle" aria-pressed="false" data-i18n-attr="aria-label:langToggleLabel,title:langToggleTitle" data-i18n="langToggleText">EN</button>
  </div>
</header>

<main>
  <!-- 音階 / 琶音:選擇器(由 js/app.js 依設定產生) -->
  <section class="card picker pane" data-pane="scale" id="paneScale">
    <button class="setup-summary" aria-expanded="false"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span class="sum"></span><svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
    <div class="setup-body"><div class="quick" hidden></div><div class="rows"></div></div>
  </section>
  <section class="card picker pane" data-pane="arp" id="paneArp" hidden>
    <button class="setup-summary" aria-expanded="false"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span class="sum"></span><svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
    <div class="setup-body"><div class="quick" hidden></div><div class="rows"></div></div>
  </section>

  <!-- 哈農:選曲目、調、手(由 js/app.js 產生) -->
  <section class="card picker pane" data-pane="hanon" id="paneHanon" hidden>
    <button class="setup-summary" aria-expanded="false"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span class="sum"></span><svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
    <div class="setup-body"><div class="quick" hidden></div><div class="rows"></div></div>
  </section>

  <!-- 檢定抽考 -->
  <section class="card setup pane" data-pane="exam" id="paneExam" hidden>
    <button class="setup-summary" aria-expanded="false"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span class="sum" id="examSummary"></span><svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
    <div class="setup-body">
      <div class="fields">
        <div class="field"><span class="lbl" data-i18n="lblSystem">考試系統</span>
          <div class="seg" id="systemSeg" role="group" aria-label="考試系統">
            <button data-v="abrsm" aria-pressed="true">ABRSM</button>
            <button data-v="trinity" aria-pressed="false">Trinity</button>
          </div></div>
        <div class="field"><label for="selGrade" data-i18n="lblGrade">級數</label><select id="selGrade"></select></div>
        <div class="field" id="fSet"><span class="lbl" data-i18n="lblSet">準備哪一組(Trinity)</span>
          <div class="seg" id="setSeg" role="group" aria-label="A 組或 B 組">
            <button data-v="A" aria-pressed="true" data-i18n="setA">A 組</button>
            <button data-v="B" aria-pressed="false" data-i18n="setB">B 組</button>
          </div></div>
        <div class="field" id="fQuality"><span class="lbl" data-i18n="lblQuality">大調 / 小調</span>
          <div class="seg" id="qualitySeg" role="group" aria-label="大小調">
            <button data-v="all" aria-pressed="true" data-i18n="qAll">全部</button>
            <button data-v="major" aria-pressed="false" data-i18n="qMajor">大調</button>
            <button data-v="minor" aria-pressed="false" data-i18n="qMinor">小調</button>
          </div></div>
        <div class="field"><label for="selMinor" data-i18n="lblMinorForm">小調形式(考生自選時)</label>
          <select id="selMinor">
            <option value="harmonic" data-i18n="formHarmonic">和聲小調</option>
            <option value="melodic" data-i18n="formMelodic">旋律小調</option>
            <option value="natural" data-i18n="formNatural">自然小調(大綱允許時)</option>
          </select></div>
        <div class="field full" id="fCats"><span class="lbl" data-i18n="lblCats">抽考範圍</span>
          <div class="chips" id="catChips"></div></div>
        <div class="field full">
          <div class="chips"><button class="chip" id="excludeMastered" aria-pressed="false">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
            <span data-i18n="excludeMastered">排除已通過的項目</span></button></div></div>
      </div>
      <p class="verify-note" id="verifyNote"></p>
    </div>
  </section>

  <!-- 練習面板(音階、琶音、檢定共用) -->
  <section class="card quiz" id="quizCard" aria-live="polite">
    <div class="quiz-top">
      <span class="verify-badge" id="verifyBadge" hidden></span>
      <span class="loading" id="loadingMsg"></span>
      <span class="count" id="poolCount"></span>
      <div class="q-actions">
      <button class="btn primary" id="drawBtn" hidden>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1.3" fill="currentColor"/><circle cx="16" cy="16" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/></svg>
        <span class="btn-label" id="drawLabel">隨機抽考</span></button>
      <button class="btn" id="nextBtn" hidden>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
        <span class="btn-label" id="nextLabel" data-i18n="next">下一項</span></button>
      <button class="btn" id="mockBtn" hidden>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/></svg>
        <span class="btn-label mock-label" id="mockLabel">模擬考</span></button>
    </div>
    </div>
    <!-- 右撇子:播放鈕在題目右邊,通過/待加強在標籤右邊(只用圖示) -->
    <div class="q-head">
      <div class="q-title empty" id="qTitle"></div>
      <button class="play-round" id="playBtn" disabled>
        <svg class="play-ring" id="playRing" viewBox="0 0 64 64" aria-hidden="true"><circle class="ring-bg" cx="32" cy="32" r="30" pathLength="1"/><circle class="ring-fg" cx="32" cy="32" r="30" pathLength="1"/></svg>
        <svg id="playIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16l13-8z"/></svg>
        <span class="sr" id="playLabel">播放示範</span></button>
    </div>
    <div class="q-row">
      <div class="q-tags" id="qTags"></div>
      <div class="mastery">
        <button class="mbtn" data-m="good" aria-pressed="false" disabled data-i18n-attr="aria-label:good,title:good">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></button>
        <button class="mbtn" data-m="weak" aria-pressed="false" disabled data-i18n-attr="aria-label:weak,title:weak">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18.4A2 2 0 0 0 3.5 21h17a2 2 0 0 0 1.7-2.6L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg></button>
      </div>
    </div>
  </section>

  <section class="card" id="scoreCard">
    <div class="score-head">
      <div class="card-title" style="margin:0"><b data-i18n="scoreTitle">樂譜與指法</b></div>
      <span style="flex:1"></span>
      <div class="seg small" id="handSeg" role="group" aria-label="顯示哪隻手">
        <button data-v="rh" aria-pressed="false" data-i18n="handRH">右手</button>
        <button data-v="lh" aria-pressed="false" data-i18n="handLH">左手</button>
        <button data-v="both" aria-pressed="true" data-i18n="handBoth">雙手</button>
      </div>
    </div>
    <div class="paper" id="stage"><div id="scroll"><div id="osmd"></div></div><div id="playline" hidden></div><div class="paper-msg" id="paperMsg"></div></div>
    <p class="score-note" id="scoreNote" hidden></p>
  </section>

  <section class="card" id="metroCard">
    <div class="card-title"><b data-i18n="metroTitle">速度</b><span class="sub" id="examTempo"></span></div>
    <div class="metro">
      <button class="btn round" id="bpmDown" data-i18n-attr="aria-label:bpmDown,title:bpmDown" aria-label="慢 1(按住連續減少)" title="慢 1(按住連續減少)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
      <div class="bpm"><b id="bpmVal">60</b><small id="bpmUnit">♩ / 分</small><small id="bpmPct"></small></div>
      <button class="btn round" id="bpmUp" data-i18n-attr="aria-label:bpmUp,title:bpmUp" aria-label="快 1(按住連續增加)" title="快 1(按住連續增加)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
      <input type="range" id="bpmRange" min="30" max="300" step="1" value="60" data-i18n-attr="aria-label:tempo" aria-label="速度" style="grid-column:1 / -1">
      <div class="row2">
        <button class="btn ghost small" id="bpmReset" data-i18n="bpmReset">回到考試速度</button>
        <div class="beats" id="beats"><i class="first"></i><i></i><i></i><i></i></div>
      </div>
      <!-- 播放選項:循環、每輪加快(速度階梯)、只聽拍點(自己彈,不放示範) -->
      <div class="play-opts">
        <button class="chip" id="optLoop" aria-pressed="false" data-i18n="optLoop">循環播放</button>
        <button class="chip" id="optRamp" aria-pressed="false" data-i18n="optRamp">每輪 +4</button>
        <button class="chip" id="optClick" aria-pressed="false" data-i18n="optClick">只聽拍點</button>
      </div>
    </div>
  </section>

  <!-- 練習紀錄:連續天數、今天練了幾次、最近 7 天 -->
  <section class="card" id="logCard">
    <div class="card-title"><b data-i18n="logTitle">練習紀錄</b></div>
    <div class="log-stats">
      <div><b id="logStreak">0</b><small data-i18n="logStreak">連續天數</small></div>
      <div><b id="logToday">0</b><small data-i18n="logToday">今天次數</small></div>
      <div><b id="logMin">0</b><small data-i18n="logMin">今天分鐘</small></div>
    </div>
    <div class="log-week" id="logWeek"></div>
  </section>

  <!-- 檢定:本級要求清單 -->
  <details class="card pane" data-pane="exam" id="listCard" hidden>
    <summary class="card-title"><b id="listTitle">本級要求</b><span class="sub" id="listSub"></span>
      <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></summary>
    <div class="progress"><i id="progressBar" style="width:0"></i></div>
    <div class="legend-row"><span><i class="dot good"></i><span data-i18n="legendGood">通過</span></span><span><i class="dot weak"></i><span data-i18n="legendWeak">待加強</span></span><span><i class="dot"></i><span data-i18n="legendNone">未標記</span></span></div>
    <div id="qGroups"></div>
  </details>

  <footer data-i18n="footer" data-i18n-pair></footer>
</main>

<!-- 底部分頁 -->
<nav class="tabbar" id="tabbar" role="tablist" aria-label="練習項目">
  <button role="tab" data-tab="scale" aria-selected="true">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 19h4v-4h4v-4h4V7h4"/></svg><span data-i18n="tabScale">音階</span></button>
  <button role="tab" data-tab="arp" aria-selected="false">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18 9 12l4 3 7-9"/><circle cx="4" cy="18" r="1.5"/><circle cx="9" cy="12" r="1.5"/><circle cx="13" cy="15" r="1.5"/><circle cx="20" cy="6" r="1.5"/></svg><span data-i18n="tabArp">琶音</span></button>
  <button role="tab" data-tab="hanon" aria-selected="false">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 0 0-4 0v5"/><path d="M14 10V4a2 2 0 0 0-4 0v6"/><path d="M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg><span data-i18n="tabHanon">哈農</span></button>
  <button role="tab" data-tab="exam" aria-selected="false">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6l1 2h3v15H5V6h3z"/><path d="m9 13 2 2 4-4"/></svg><span data-i18n="tabExam">檢定</span></button>
</nav>

<!-- 第一次打開:在準備考試嗎? -->
<div class="modal" id="onboard" hidden role="dialog" aria-modal="true" aria-labelledby="onboardTitle">
  <div class="modal-card">
    <h2 id="onboardTitle" data-i18n="obTitle">你在準備鋼琴檢定嗎?</h2>
    <p class="modal-sub" data-i18n="obSub" data-i18n-pair>選了考試和級數,App 會直接打開「檢定」分頁,音階、琶音分頁也會先列出這一級的要求。之後隨時可以在「檢定」分頁更改。</p>
    <div class="field"><span class="lbl" data-i18n="lblSystem">考試系統</span>
      <div class="seg" id="obSystem" role="group">
        <button data-v="abrsm" aria-pressed="true">ABRSM</button>
        <button data-v="trinity" aria-pressed="false">Trinity</button>
      </div></div>
    <div class="field"><label for="obGrade" data-i18n="lblGrade">級數</label><select id="obGrade"></select></div>
    <div class="modal-actions">
      <button class="btn primary" id="obYes" data-i18n="obYes">開始準備考試</button>
      <button class="btn ghost" id="obNo" data-i18n="obNo">不考試,自由練習</button>
    </div>
  </div>
</div>

<script type="importmap">{"imports":{"./js/app.js":"./js/app.js?v=c28aa4fc91","./js/audio.js":"./js/audio.js?v=fac3772f95","./js/exercise.js":"./js/exercise.js?v=ec6bc9046d","./js/fingering.js":"./js/fingering.js?v=2f23bdb12b","./js/hanon.js":"./js/hanon.js?v=3f1086105e","./js/i18n.js":"./js/i18n.js?v=a8b58225b9","./js/musicxml.js":"./js/musicxml.js?v=4257980f50","./js/store.js":"./js/store.js?v=35871c8c49","./js/syllabus.js":"./js/syllabus.js?v=cdf3a21898","./js/theory.js":"./js/theory.js?v=ed03457554"}}</script>

<script type="module" src="js/app.js?v=c28aa4fc91"></script>
</body>
</html>
